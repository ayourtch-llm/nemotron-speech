[package]
name = "nemotron-speech"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = "0.10"
candle-nn = "0.10"
safetensors = "0.4"
realfft = "3"
rustfft = "6"
sentencepiece = "0.11"
symphonia = { version = "0.5", features = ["aac", "isomp4", "wav", "pcm"] }
hound = "3.5"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "signal"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
half = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mp3lame-encoder = { version = "0.2", optional = true }
webrtc-audio-processing = { version = "~2.0", optional = true }
webrtc-audio-processing-config = { version = "~2.0", optional = true }

[features]
default = ["cpu"]
cpu = []
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
mic = ["dep:cpal"]
mp3 = ["dep:mp3lame-encoder"]
webrtc-aec = [
    "dep:webrtc-audio-processing",
    "dep:webrtc-audio-processing-config",
    "webrtc-audio-processing/bundled",
]

[dependencies.cpal]
version = "0.15"
optional = true

# udp_mic_send is #![cfg(feature = "mic")]: without this gate a default
# (no-mic) build hits E0601 "main not found" on the empty module.
[[bin]]
name = "udp_mic_send"
path = "src/bin/udp_mic_send.rs"
required-features = ["mic"]

[profile.release]
opt-level = 3
lto = "thin"
