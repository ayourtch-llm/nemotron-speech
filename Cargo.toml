[package]
name = "nemotron-speech"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
safetensors = "0.4"
sentencepiece = "0.11"
symphonia = { version = "0.5", features = ["aac", "isomp4", "wav", "pcm"] }
hound = "3.5"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
half = "2"

[features]
default = ["cpu"]
cpu = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
mic = ["dep:cpal"]

[dependencies.cpal]
version = "0.15"
optional = true

[profile.release]
opt-level = 3
lto = "thin"
